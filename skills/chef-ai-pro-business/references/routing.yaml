schema_version: 1
authority_source: references/source_registry.yaml
audiences: [INTERNAL, OPERATIONS, CLIENT-SAFE]
default_policy:
  selection: smallest_sufficient
  followups: material_only
  assumptions: label_and_proceed_when_safe
  creativity_order: explore_then_validate_then_optimize
skills:
  - chef-ai-pro-business
  - culinary-rnd
  - recipe-engineering
  - menu-experience-design
  - kitchen-event-operations
  - food-safety-allergens
  - costing-commercial-intelligence
  - supplier-procurement-intelligence
  - evochia-company-operations
  - evochia-brand-documents
  - evochia-product-development
  - evochia-market-intelligence
routes:
  - route_id: quick_recipe
    intent: recipe_or_classical_cooking
    context: any
    required_skills: [recipe-engineering]
    optional_skills: [culinary-rnd, food-safety-allergens]
  - route_id: culinary_trend
    intent: current_culinary_inspiration_or_trend
    context: any
    freshness: current_research
    required_skills: [culinary-rnd]
    optional_skills: [recipe-engineering, menu-experience-design]
  - route_id: professional_menu
    intent: menu_or_private_dining_design
    context: any
    required_skills: [menu-experience-design]
    optional_skills: [culinary-rnd, recipe-engineering, kitchen-event-operations, food-safety-allergens]
  - route_id: evochia_private_chef
    intent: evochia_private_chef_or_event_enquiry
    context: evochia
    required_skills: [evochia-company-operations, kitchen-event-operations, costing-commercial-intelligence, evochia-brand-documents]
    optional_skills: [menu-experience-design, recipe-engineering, food-safety-allergens, supplier-procurement-intelligence]
  - route_id: safety_critical
    intent: allergen_food_safety_haccp_hygiene_or_current_sanitary_material
    context: any
    required_skills: [food-safety-allergens]
    optional_skills: [recipe-engineering, menu-experience-design, kitchen-event-operations]
    hard_gate: safety
    research_policy: on_demand_official_when_current_claim
  - route_id: evochia_market_intelligence
    intent: evochia_competitor_seo_growth_market_intelligence
    context: evochia
    freshness: snapshot_plus_current_evidence_when_claim_is_mutable
    required_skills: [evochia-market-intelligence]
    optional_skills: [evochia-company-operations, evochia-product-development, evochia-brand-documents]
    source_policy: source_registry_current_dataset_plus_ci_methodology
  - route_id: supplier_refresh
    intent: refresh_or_compare_supplier_prices
    context: any
    required_skills: [supplier-procurement-intelligence]
    optional_skills: [costing-commercial-intelligence]
    tool_policy: explicit_user_request
  - route_id: new_evochia_product
    intent: new_product_or_service_development
    context: evochia
    required_skills: [evochia-product-development]
    optional_skills: [evochia-company-operations, evochia-market-intelligence, culinary-rnd, menu-experience-design, kitchen-event-operations, costing-commercial-intelligence, evochia-brand-documents]
  - route_id: client_safe_proposal
    intent: evochia_client_proposal_or_offer
    context: evochia
    output_audience: CLIENT-SAFE
    required_skills: [evochia-company-operations, costing-commercial-intelligence, evochia-brand-documents]
    optional_skills: [kitchen-event-operations, menu-experience-design]
    commercial_terms_policy: canonical_evochia_terms_with_explicit_overrides
    commercial_terms_authority:
      terms: company/evochia/policies/terms_policy.md
      commercial: company/evochia/policies/commercial_policy.md
      rates: company/evochia/policies/current_rates.md
      legal_identity: company/evochia/policies/company_profile.md
    commercial_terms_requirements:
      - canonical_quote_validity_or_explicit_late_override
      - confirmation_payment_based_on_service_start_distance
      - t5_balance_only_on_30_percent_confirmation_path
      - canonical_cancellation_scope_postponement_terms
      - transport_verified_before_booking_confirmation
      - binding_documents_require_runtime_resolved_legal_particulars
      - household_uses_recurring_framework_not_event_defaults
      - client_safe_projection_excludes_internal_only_fields
      - material_repricing_triggers_explicit
      - vat_net_gross_presentation_explicit_when_material
    blockers:
      - unresolved_safety_conflict
      - unresolved_material_transport_at_confirmation
      - missing_required_binding_legal_particulars
      - ambiguous_service_model_or_material_override
