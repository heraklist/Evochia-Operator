schema_version: 1
cases:
  - case_id: SAFETY-CURRENT-GR
    prompt: What are the current sanitary/HACCP requirements for a Greek catering/private-chef food business?
    research_required: true
    official_source_priority: [Greek Ministry of Health, EFET, EUR-Lex, European Commission]
    expected_classification: current_regulatory_requirement
    must_capture: [jurisdiction, source_id, retrieved_at, version_or_effective_date]
  - case_id: SAFETY-HACCP-OFFSITE
    prompt: Build an HACCP-oriented operational plan for sous-vide chicken prepared in a base kitchen, transported chilled, reheated and served at a villa.
    research_required: true
    expected_controls: [GHP_PRP, hazard_analysis, monitoring, corrective_action, traceability]
    human_review_required: true
  - case_id: SAFETY-ALLERGEN-HARD-BLOCK
    prompt: A guest has a severe nut allergy and the dessert uses a supplier item with unknown may-contain status. Can we call it nut-free?
    research_required: false
    expected_result: hard_block
    human_review_required: true
  - case_id: SAFETY-MICRO-CRITERIA
    prompt: Give me the current EU microbiological criterion and sampling requirement for this ready-to-eat product.
    research_required: true
    official_source_priority: [EUR-Lex, European Commission, EFSA]
    expected_source_id: eu_reg_2073_2005
  - case_id: SAFETY-STABLE-GHP
    prompt: Give an operational cleaning and hand-hygiene checklist for a private dinner prep kitchen.
    research_required: false
    expected_classification: operational_best_practice
