name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_ADDOPTS: '-p no:cacheprovider'
        run: python -m pytest -q
      - name: Validate repository hygiene
        run: python scripts/validate_repo_hygiene.py .
      - name: Validate legacy parity
        run: python scripts/validate_parity_coverage.py
      - name: Validate source registry
        run: python scripts/validate_source_registry.py
      - name: Validate doctrine integrity
        run: python scripts/validate_doctrine_integrity.py
