schema_version: 1
reviewed_at: '2026-09-02'
update_mode: on_demand_only
background_monitoring: false
policy: >-
  Use this registry to choose official sources during a safety task. Re-check the live official source whenever a claim depends on current law, guidance, limits, dates, applicability or jurisdiction. Do not treat the reviewed_at snapshot as a substitute for live verification.
sources:
  - source_id: eu_reg_852_2004
    organization: EUR-Lex / European Union
    jurisdiction: EU
    authority_type: binding_law
    scope: [food_hygiene, haccp, temperature_control, cold_chain, training, food_safety_culture, allergen_management]
    canonical_url: https://eur-lex.europa.eu/eli/reg/2004/852
    version_checked: '2021-03-24'
    live_reverify: true
    notes: Article 5 establishes permanent procedures based on HACCP principles; use the current consolidated text at answer time.
