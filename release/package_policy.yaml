  - Login Data
  - Web Data
  - History
  - Local State
  - Network Persistent State
  - '*.key'
  - '*.pem'
  - '*.p12'
  - '*.pfx'
  - __pycache__
  - .pytest_cache
  - .venv
  - venv
  - output
allowed_exception_files:
  - .env.example
font_binaries_in_package: false
backend_source_in_package: false
external_backend_repository: heraklist/chef-ai-pro-business-api
private_package: true
confidential_assets_require_intentional_inclusion: true
max_repository_candidate_bytes: 26214400
validation:
  - all_required_skills_present
  - skill_frontmatter_valid
  - referenced_repo_paths_exist
  - forbidden_runtime_files_absent
  - source_registry_valid
  - package_size_within_limit
